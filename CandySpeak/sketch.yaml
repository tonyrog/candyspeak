# generated by `gen_chips.erl --sketch-yaml` -- do not edit.
# boards/<name>/<name>.terms is the source; one profile per board.
#
# Build one with:  arduino-cli compile -m <board>
# (Makefile.board does this for you.)
#
# The profile pins the CORE and LIBRARY versions. It cannot carry the
# -I/-D build properties -- those stay on the command line -- so what it
# buys is reproducibility, not fewer flags.
